name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Runs on tags like v1.0.0, v1.2.3, etc.

permissions:
  contents: write

env:
  APP_NAME: Tabula

jobs:
  build:
    # Homebrew bottles target the runner's macOS and get bundled: keep it at LSMinimumSystemVersion.
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Install libpq
        run: brew install libpq

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Run tests
        run: swift test

      - name: Set bundle version
        run: |
          plutil -replace CFBundleShortVersionString -string "${{ steps.get_version.outputs.VERSION }}" Resources/Info.plist
          plutil -replace CFBundleVersion -string "$(git rev-list --count HEAD)" Resources/Info.plist

      # The stable release certificate (CONTRIBUTING.md, "Release signing") keeps the designated
      # requirement the same across releases; forks without the secrets build ad-hoc signed.
      # Hosted runners are discarded after the job, so the keychain is not deleted.
      - name: Import signing certificate
        id: signing
        env:
          CERT_P12: ${{ secrets.TABULA_SIGNING_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.TABULA_SIGNING_CERT_PASSWORD }}
        run: |
          if [[ -z "$CERT_P12" || -z "$CERT_PASSWORD" ]]; then
            echo "no signing certificate in the secrets: the app will be signed ad-hoc"
            echo "identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          base64 --decode <<< "$CERT_P12" > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -f pkcs12 -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user | xargs security list-keychains -d user -s "$KEYCHAIN"
          echo "identity=Tabula Release Signing" >> "$GITHUB_OUTPUT"

      # Bundles libpq and its dylibs. With the certificate, an ad-hoc signature (designated
      # requirement = cdhash) would bring back the Keychain prompts after every update: fail instead.
      - name: Build app bundle
        env:
          TABULA_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          ./scripts/build-app.sh
          DR=$(codesign -d -r- "build/${{ env.APP_NAME }}.app" 2>&1 | grep 'designated =>')
          echo "$DR"
          if [[ "$TABULA_SIGN_IDENTITY" != "-" && "$DR" != *certificate* ]]; then
            echo "error: the app is not signed with the release certificate" >&2
            exit 1
          fi

      - name: Create DMG
        run: |
          mkdir -p dmg_temp
          cp -R "build/${{ env.APP_NAME }}.app" dmg_temp/
          ln -s /Applications dmg_temp/Applications

          hdiutil create -volname "${{ env.APP_NAME }}" \
            -srcfolder dmg_temp \
            -ov -format UDZO \
            "${{ env.APP_NAME }}-${{ steps.get_version.outputs.VERSION }}.dmg"

          rm -rf dmg_temp

      - name: Calculate SHA256
        id: sha256
        run: |
          SHA256=$(shasum -a 256 "${{ env.APP_NAME }}-${{ steps.get_version.outputs.VERSION }}.dmg" | cut -d' ' -f1)
          echo "SHA256=${SHA256}" >> $GITHUB_OUTPUT
          echo "SHA256: ${SHA256}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: ${{ env.APP_NAME }}-${{ steps.get_version.outputs.VERSION }}.dmg
          body: |
            ## Tabula v${{ steps.get_version.outputs.VERSION }}

            ### Installation

            **With Homebrew (recommended):**
            ```bash
            brew install --cask andreabasile/tap/tabula
            ```

            **Manually:**
            1. Download the DMG below
            2. Open it and drag Tabula into Applications
            3. On first launch: right-click › Open (the app is not notarized)

            ### SHA256
            ```
            ${{ steps.sha256.outputs.SHA256 }}
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew Tap
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: andreabasile/homebrew-tap
          event-type: update-cask
          client-payload: |
            {
              "cask": "tabula",
              "version": "${{ steps.get_version.outputs.VERSION }}",
              "sha256": "${{ steps.sha256.outputs.SHA256 }}",
              "url": "https://github.com/${{ github.repository }}/releases/download/v${{ steps.get_version.outputs.VERSION }}/${{ env.APP_NAME }}-${{ steps.get_version.outputs.VERSION }}.dmg"
            }
