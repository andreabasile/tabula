name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Trigger su tag come v1.0.0, v1.2.3, etc.

permissions:
  contents: write

env:
  APP_NAME: Tabula

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install libpq
        run: brew install libpq

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Run tests
        run: swift test

      - name: Set bundle version
        run: |
          plutil -replace CFBundleShortVersionString -string "${{ steps.get_version.outputs.VERSION }}" Resources/Info.plist
          plutil -replace CFBundleVersion -string "$(git rev-list --count HEAD)" Resources/Info.plist

      # Bundles libpq and its dylibs; without a certificate in the runner the signature is ad-hoc.
      - name: Build app bundle
        run: TABULA_SIGN_IDENTITY=- ./scripts/build-app.sh

      - name: Create DMG
        run: |
          mkdir -p dmg_temp
          cp -R "build/${{ env.APP_NAME }}.app" dmg_temp/
          ln -s /Applications dmg_temp/Applications

          hdiutil create -volname "${{ env.APP_NAME }}" \
            -srcfolder dmg_temp \
            -ov -format UDZO \
            "${{ env.APP_NAME }}-${{ steps.get_version.outputs.VERSION }}.dmg"

          rm -rf dmg_temp

      - name: Calculate SHA256
        id: sha256
        run: |
          SHA256=$(shasum -a 256 "${{ env.APP_NAME }}-${{ steps.get_version.outputs.VERSION }}.dmg" | cut -d' ' -f1)
          echo "SHA256=${SHA256}" >> $GITHUB_OUTPUT
          echo "SHA256: ${SHA256}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APP_NAME }}-${{ steps.get_version.outputs.VERSION }}.dmg
          body: |
            ## Tabula v${{ steps.get_version.outputs.VERSION }}

            ### Installazione

            **Con Homebrew (consigliato):**
            ```bash
            brew install --cask andreabasile/tap/tabula
            ```

            **A mano:**
            1. Scarica il DMG qui sotto
            2. Aprilo e trascina Tabula in Applicazioni
            3. Al primo avvio: tasto destro › Apri (l'app non è notarizzata)

            ### SHA256
            ```
            ${{ steps.sha256.outputs.SHA256 }}
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew Tap
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: andreabasile/homebrew-tap
          event-type: update-cask
          client-payload: |
            {
              "cask": "tabula",
              "version": "${{ steps.get_version.outputs.VERSION }}",
              "sha256": "${{ steps.sha256.outputs.SHA256 }}",
              "url": "https://github.com/${{ github.repository }}/releases/download/v${{ steps.get_version.outputs.VERSION }}/${{ env.APP_NAME }}-${{ steps.get_version.outputs.VERSION }}.dmg"
            }
